# Perfil de desarrollo de FASE 2.
#
# Apunta a una base SEPARADA (fase2therateam) para poder crear y modificar tablas sin tocar
# la estructura de lo que ya esta publicado. La base de la v1 (BDClinicaSAAS) queda intacta.
#
# Como arrancar el backend en fase 2:
#   mvn spring-boot:run -Dspring-boot.run.profiles=fase2
#
# Sin este perfil el backend sigue usando BDClinicaSAAS, igual que siempre.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fase2therateam}
